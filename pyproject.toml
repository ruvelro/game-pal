[project]
name = "game-pal"
version = "0.1.0.dev0"
description = "Compañero de juego con IA: mira la pantalla, te escucha y te aconseja. Local, privado y para cualquier juego."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
authors = [{ name = "ruvelro" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "websockets>=13.0",
    "python-multipart>=0.0.18",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "numpy>=2.0",
    "pillow>=11.0",
    "mss>=10.0",
    "platformdirs>=4.3",
    # RapidOCR depende de opencv-python-headless, que no publica ruedas para Windows ARM64:
    # allí se usa Windows OCR, que viene con el sistema.
    "rapidocr>=3.4; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "onnxruntime>=1.20",
    "pyobjc-framework-Quartz>=11.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=11.0; sys_platform == 'darwin'",
    "pyobjc-framework-ScreenCaptureKit>=11.0; sys_platform == 'darwin'",
    "python-xlib>=0.33; sys_platform == 'linux'",
    "winrt-runtime>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.2; sys_platform == 'win32'",
    "rapidfuzz>=3.9",
    # Conocimiento
    "trafilatura>=2.0",
    "pypdf>=5.0",
    "tokenizers>=0.20",
    "huggingface-hub>=0.26",
    # Voz
    "sounddevice>=0.5",
    "faster-whisper>=1.1; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "piper-tts>=1.2",
    "pynput>=1.7",
    "pysdl2>=0.9.16",
    "pysdl2-dll>=2.30",
]

[project.optional-dependencies]
macos-vision = ["pyobjc-framework-Vision>=11.0; sys_platform == 'darwin'"]

[project.scripts]
game-pal = "gamepal.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gamepal"]

[tool.hatch.build.targets.wheel.force-include]
"profiles" = "gamepal/_bundled_profiles"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["gamepal"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["mss.*", "rapidocr.*", "Quartz.*", "AppKit.*", "Foundation.*", "Vision.*", "ScreenCaptureKit.*", "Xlib.*", "objc.*", "sounddevice.*", "faster_whisper.*", "piper.*", "pynput.*", "sdl2.*", "onnxruntime.*", "PyObjCTools.*", "trafilatura.*", "tokenizers.*", "huggingface_hub.*", "pypdf.*", "lxml.*"]
ignore_missing_imports = true

# pywinrt solo se instala en Windows; el motor lo usa como Any para que los tipos no dependan del sistema.
[[tool.mypy.overrides]]
module = ["winrt.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "ocr: tests que cargan el motor OCR real (más lentos)",
    "voice: tests de voz con modelos reales (descargan modelos; usa -m voice)",
    "windows_ocr: tests que usan Windows OCR (solo Windows)",
]
addopts = "-m 'not voice'"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
